<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Main Tech Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- AI Core Glowing Gradient -->
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <!-- Polygon Vector Overlay -->
    <linearGradient id="polyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Shadow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Base -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />

  <!-- Geospatial Vector Grid Background -->
  <g stroke="#334155" stroke-width="2" stroke-dasharray="4,4" fill="none">
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="256" y1="80" x2="256" y2="432" />
    <circle cx="256" cy="256" r="160" />
    <circle cx="256" cy="256" r="100" />
  </g>

  <!-- Segmented Spatial Polygon (Raster AI Vectorization motif) -->
  <polygon points="170,180 290,140 370,220 330,340 190,320" fill="url(#polyGrad)" stroke="#38BDF8" stroke-width="3" stroke-linejoin="round" />

  <!-- GeoVision Geometric Eye Outer Contour -->
  <path d="M 96 256 C 160 150, 352 150, 416 256 C 352 362, 160 362, 96 256 Z" 
        fill="none" 
        stroke="url(#blueGrad)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Aperture / Iris Ring -->
  <circle cx="256" cy="256" r="72" fill="none" stroke="url(#aiGrad)" stroke-width="10" />

  <!-- AI Core Pupil & Neural Nodes -->
  <circle cx="256" cy="256" r="32" fill="#00F2FE" />
  
  <!-- Corner Vector Anchor Points (AI Bounding / Segmentation Handles) -->
  <circle cx="170" cy="180" r="7" fill="#38BDF8" />
  <circle cx="290" cy="140" r="7" fill="#38BDF8" />
  <circle cx="370" cy="220" r="7" fill="#38BDF8" />
  <circle cx="330" cy="340" r="7" fill="#38BDF8" />
  <circle cx="190" cy="320" r="7" fill="#38BDF8" />

  <!-- Bounding Box Crosshairs (Targeting/Detection) -->
  <path d="M 120 130 H 160 M 120 130 V 170" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" />
  <path d="M 392 130 H 352 M 392 130 V 170" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" />
  <path d="M 120 382 H 160 M 120 382 V 342" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" />
  <path d="M 392 382 H 352 M 392 382 V 342" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" />
</svg>
